# Guide final pour Kodi : xmltvfr.fr (filtré sur channels.txt) + chaînes complémentaires d'iptv-org
# Guide servi sur http://<ip-du-mac>:8082/guide.xml.gz
# Prérequis pour la fusion : la stack ../iptv-org doit tourner (sinon guide xmltvfr seul).
services:
  xmltvfr-filter:
    image: python:3.12-alpine
    container_name: xmltvfr-filter
    environment:
      - TZ=Europe/Paris
      - SOURCE_URL=https://xmltvfr.fr/xmltv/xmltv.xml.gz   # complet (~780 chaînes FR/BE/CH/DE…)
      - EXTRA_FILES=/extra/iptv-org/guide.xml              # guides fusionnés (séparés par des virgules)
      - INTERVAL=14400   # secondes entre 2 constructions (4 h). xmltvfr est régénéré 1x/jour vers 2h30
    volumes:
      - ./app/filter.py:/app/filter.py:ro
      - ./channels.txt:/app/channels.txt:ro
      - ../iptv-org/public:/extra/iptv-org:ro              # dossier (pas le fichier) : il est remplacé à chaque grab
      - ./data:/data
    # boucle simple plutôt qu'un cron : une construction au démarrage puis toutes les INTERVAL secondes
    command: sh -c 'while true; do python -u /app/filter.py; sleep "$$INTERVAL"; done'
    restart: unless-stopped

  xmltvfr-http:
    image: nginx:1.27-alpine
    container_name: xmltvfr-http
    ports:
      - "8082:80"
    volumes:
      - ./data:/usr/share/nginx/html:ro
    restart: unless-stopped
